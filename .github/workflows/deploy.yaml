name: Deploy to CloudHub 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    container:
      image: maven:3.9.9-eclipse-temurin-17
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      MULE_KEY: ${{ secrets.MULE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Java and Maven
        run: |
          mvn -version
          java -version

      - name: Validate required secrets
        shell: bash
        run: |
          for v in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET MULE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is missing"
              exit 1
            fi
          done

      - name: Package and deploy to CloudHub 2.0
        run: >
          mvn -B -s .github/maven-settings.xml
          clean package mule:deploy
          -DskipMunitTests
