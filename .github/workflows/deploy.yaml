name: Deploy to CloudHub 2.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you run it manually from the GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and deploy to CloudHub 2.0
        run: >
          mvn -B clean deploy -DmuleDeploy
          -Danypoint.client.id=${{ secrets.ANYPOINT_CLIENT_ID }}
          -Danypoint.client.secret=${{ secrets.ANYPOINT_CLIENT_SECRET }}
          -Dmule.key=${{ secrets.MULE_KEY }}
