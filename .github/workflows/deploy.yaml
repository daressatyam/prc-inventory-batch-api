
name: Deploy to CloudHub 2.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Pin Maven and Java to avoid Maven Resolver API incompatibility
    container:
      image: maven:3.9.9-eclipse-temurin-17

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Java and Maven
        run: |
          mvn -version
          java -version

      - name: Build and deploy to CloudHub 2.0
        run: >
          mvn -B clean deploy -DmuleDeploy
          -Danypoint.client.id="${{ secrets.ANYPOINT_CLIENT_ID }}"
          -Danypoint.client.secret="${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          -Dmule.encryptionKey="${{ secrets.MULE_KEY }}"
          -Dmule.env="${{secrets.SANDBOX}}"
