name: Deploy to CloudHub 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      MULE_KEY: ${{ secrets.MULE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate required secrets
        run: |
          for v in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET MULE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is missing"
              exit 1
            fi
          done

      - name: Package and deploy to CloudHub 2.0
        run: >
          mvn -B -s .github/maven-settings.xml
          clean package mule:deploy
          -DskipMunitTests
