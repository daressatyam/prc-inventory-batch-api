scheduler:
  cron: "0 0 4 * * ?"
  timezone: "America/New_York"
  enabled: "true"
  time: ""
  
batch:
  blockSize: "2000"
  maxConcurrency: "6"
  aggregatorSize: "2000"

validation:
  enum:
    Standard: "Standard"
    Backorder: "Backorder"
    
file:
  format: ".csv"
  prefix: "inventory_"
  errorFile: "inventory_error_file_"
  errorHeaders: "traceId,errorType,errorMessage\n"
  
objectStore:
  max:
    entry: "1000"
  ttl: "48"
  expiration: "60"

http:
  port: "8081"